name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
      branches: ["main"]
  workflow_dispatch: 

jobs:
  sonarqube:
    runs-on: wsl-linux
    if: github.event_name == 'pull_request'

    steps:
      - name: clone code
        uses: actions/checkout@v7

      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.projectKey=NodeApplication
            -Dsonar.sources=.
            -Dsonar.host.url=${{ vars.SONAR_HOST_URL }}
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
            -Dsonar.qualitygate.wait=true

  docker:
     runs-on: wsl-linux
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
     
      
     steps:
      - name: Clone code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Docker buil image
        run: docker build -f dockerfile.distroless -t dockerfile-distroless .

      - name: tag and push docker image
        run: |
          short_sha=${GITHUB_SHA::7}
          docker tag dockerfile-distroless ${{ vars.DOCKERHUB_USERNAME }}/nodeapp:$short_sha
          docker push ${{ vars.DOCKERHUB_USERNAME }}/nodeapp:$short_sha
