name: Node Basic Pipeline

on:
  push: 
    branches: ["main"]
  workflow_dispatch: 

jobs:
  node:
    runs-on: wsl-linux

    steps:
      - name: Clone code
        uses: actions/checkout@v7

      - name: set up node js
        uses: actions/setup-node@v7
          with:
            node-version: 24

      - name: Install dependecies
          run: npm install

      - name: Run the Application
          run: |
            node dev.js
            sleep 5
            curl http://locahost:8080
            curl http://locahost:8080/health
            pkill -f "node dev.js"
            
          
