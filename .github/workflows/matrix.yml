name: Node matrix Pipeline

on:
  push: 
    branches: ["main"]
  workflow_dispatch: 

jobs:
  node:
    runs-on: wsl-linux
    strategy:
      matrix:
        node-version: [24, 26]

    steps:
      - name: Clone Code
        uses: actions/checkout@v7

      - name: set up node js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependecies
        run: npm install

      - name: Create .env file
        run: |
          echo "PORT=8080" >> .env.development
          echo "APP=GHA-NODE-DEV-APP" >> .env.development
          echo "PORT=5000" >> .env.production
          echo "APP=GHA-NODE-PROD-APP" >> .env.production

      - name: Run the Application
        run: |
          node dev.js &
          sleep 5
          curl http://localhost:8080
          curl http://localhost:8080/health
          pkill -f "node dev.js"
