name: Docker Build and Push

inputs: 
  username:
    description: Dockerhub username
    required: true
  password:
    description: Dockerhub Password
    required: true
  dockerfile-name:
    description: Docker file name
    required: true
  dockerhub-repo:
    description: dockerhub repo name
    required: true
  

  runs:
    using: "composite"

    steps:
      name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ inputs.username }}
          password: ${{ inputs.password }}

      - name: Docker buil image
        shell: bash
        run: docker build -f $(( inputs.dockerfile-name }} -t dockerfile .

      - name: tag and push docker image
        shell: bash
        run: |
          short_sha=${GITHUB_SHA::7}
          docker tag dockerfile ${{ inputs.username }}/${{ inputs.dockerhub-repo }}:$short_sha
          docker push ${{ inputs.username }}/${{ inputs.dockerhub-repo }}:$short_sha
